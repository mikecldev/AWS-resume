name: Deploy to S3 + CloudFront (instant updates)

on:
  push:
    branches:
      - main

env:
  S3_BUCKET: statwebstore
  CLOUDFRONT_DISTRIBUTION_ID: E2WVNASNVO7HE
  AWS_REGION: eu-west-2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync site to S3 (exclude workflow and git)
        run: |
          aws s3 sync . s3://${S3_BUCKET}/ --delete \
            --exclude ".git/*" --exclude ".github/*"

      - name: Upload index.html with no-cache (force fresh HTML)
        if: always()
        run: |
          if [ -f index.html ]; then
            aws s3 cp index.html s3://${S3_BUCKET}/index.html \
              --cache-control "no-cache, no-store, must-revalidate" \
              --content-type "text/html"
          else
            echo "index.html not found, skipping index upload"
          fi

      - name: Invalidate CloudFront cache (force immediate update)
        run: |
          aws cloudfront create-invalidation --distribution-id ${CLOUDFRONT_DISTRIBUTION_ID} --paths "/*"
